<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoria - Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .chart-container {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .data-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Savoria</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="dashboard.html" style="color: var(--primary-color);">Dashboard</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Admin Dashboard</h2>

        <div class="data-controls">
            <button class="btn btn-primary btn-sm" onclick="resetData()">Reset Demo Data</button>
        </div>

        <!-- Key Metrics -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="total-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <div class="value" id="total-revenue">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>Avg. Order Value</h3>
                <div class="value" id="avg-order-value">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>Most Popular Item</h3>
                <div class="value" id="popular-item" style="font-size: 1.2rem;">-</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="dashboard-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="chart-container">
                <h3>Sales Trends (Last 7 Days)</h3>
                <canvas id="salesChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Category Distribution</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="chart-container">
             <h3>Recent Orders</h3>
             <div style="overflow-x: auto;">
                 <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                     <thead>
                         <tr style="background: #f8f9fa; text-align: left;">
                             <th style="padding: 10px;">ID</th>
                             <th style="padding: 10px;">Date</th>
                             <th style="padding: 10px;">Items</th>
                             <th style="padding: 10px;">Total</th>
                         </tr>
                     </thead>
                     <tbody id="orders-table-body">
                         <!-- Rows injected via JS -->
                     </tbody>
                 </table>
             </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2024 Savoria Restaurant. All rights reserved.</p>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
