<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse our delicious menu containing Starters, Main Course, Desserts, and Drinks. Order online via WhatsApp now.">
    <title>Savoria - Menu</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .menu-category {
            margin-bottom: 3rem;
        }

        .category-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .menu-item {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .menu-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .menu-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .menu-info h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .menu-info p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Savoria</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" style="color: var(--primary-color);">Menu</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Our Menu</h2>
        <div id="menu-container">
            <!-- Menu items will be injected here by JS -->
        </div>
    </div>

    <a href="cart.html" class="sticky-whatsapp btn-whatsapp">
        <i class="fas fa-shopping-cart"></i> View Order
    </a>

    <footer>
        <p>&copy; 2024 Savoria Restaurant. All rights reserved.</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
